<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guía Asia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>window.GUIA = true;</script>
<title>Ruta Asia 2027</title>
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300&display=swap&text=%E4%BA%9C%E7%B4%B0%E4%BA%9C">
<style>
/* Ruta Asia 2027 — sistema visual inspirado en iOS.
   Claro por defecto, con variante oscura. La identidad asiática vive en las fotos y el contenido. */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --fill:#F0F1F5; --fill2:#E6E8EF; --sea:#DCE8F3; --landl:#C9D3DD;
  --ink:#161A26; --muted:#6E7486; --line:#E3E5EC;
  --accent:#D92D20; --accent-soft:#FDECEA; --navy:#15244F;
  /* rojo = ahora y urgente; acción e interacción = navy de la marca */
  --act:#1D3274; --act-fill:#15244F;
  --pos:#248A3D; --pos-soft:#E8F5EC; --warn:#C24E00; --warn-soft:#FFF3E6;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
  --r-card:14px; --r-btn:10px;
  /* alias que usa el código existente */
  --shu:var(--accent); --red:var(--accent); --ai:var(--navy); --ai-soft:var(--fill); --gold:#B7791F;
  --on-bg:var(--ink); --on-bg-muted:var(--muted); --solid:var(--surface); --shu-soft:var(--accent-soft);
  --kr:#2F5AA8; --jp:#1F7A8C; --hk:#7A3F8F; --cn:#B8860B; --ca:#5A6270;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Noto Sans KR","Noto Sans JP","Malgun Gothic",sans-serif;
  --display:var(--font); --body:var(--font);
  --tabh:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07090F; --surface:#151923; --fill:#222736; --fill2:#2F3546; --sea:#0E1A2B; --landl:#3A4656;
  --ink:#EEF0F6; --muted:#9AA0B2; --line:#2E3444;
  --accent:#FF453A; --accent-soft:rgba(255,69,58,.16); --navy:#1E3270; --act:#A9BDF2; --act-fill:#2D4BA0;
  --pos:#30D158; --pos-soft:rgba(48,209,88,.14); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.14);
  --shadow:none; --kr:#86A8EC; --jp:#5FC3D4; --hk:#C99BE0; --cn:#E2B648; --ca:#AAB3BF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07090F; --surface:#151923; --fill:#222736; --fill2:#2F3546; --sea:#0E1A2B; --landl:#3A4656;
  --ink:#EEF0F6; --muted:#9AA0B2; --line:#2E3444;
  --accent:#FF453A; --accent-soft:rgba(255,69,58,.16); --navy:#1E3270; --act:#A9BDF2; --act-fill:#2D4BA0;
  --pos:#30D158; --pos-soft:rgba(48,209,88,.14); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.14);
  --shadow:none; --kr:#86A8EC; --jp:#5FC3D4; --hk:#C99BE0; --cn:#E2B648; --ca:#AAB3BF;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
a{color:var(--act);text-decoration:none}
button{font:inherit;color:inherit}
img{max-width:100%}
[lang="ko"],[lang="ja"],[lang="zh"],.loc,.lc{font-family:var(--cjk)}
:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:6px}

/* barra superior */
header.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;padding-top:env(safe-area-inset-top,0px);transition:border-color .2s}
header.top.scrolled{border-bottom-color:var(--line)}
header.top .in{max-width:680px;margin:0 auto;height:44px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
header.top .hbtn{flex:none;position:relative;width:36px;height:36px;margin-right:-8px;display:grid;place-items:center;border-radius:50%;color:var(--ink);text-decoration:none}
header.top .hbtn svg{width:22px;height:22px;stroke-width:1.8}
header.top .hbtn:active{background:var(--fill)}
header.top .hbtn[aria-current="page"]{color:var(--act)}
header.top .hbtn .hdot{position:absolute;top:6px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--bg)}
header.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;flex:1;white-space:nowrap}
.hanko{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;font-family:var(--cjk);font-weight:600;font-size:13px;line-height:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0}
.sync #synctxt{overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--pos)} .dot.off{background:var(--warn)}

/* contenido */
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#app.enter{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:14px 0 4px}
h3{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.015em;margin:0}
.sub{font-size:15px;color:var(--muted);margin:0 0 16px}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 2px 10px}
.sect h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sect a,.sect .small{font-size:15px}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card > h3 + .small,.card-h + .small{margin-top:2px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.divider{display:none}
.chip{display:inline;font-size:14px;color:var(--muted)}
.ic{width:20px;height:20px;flex:none}
.ic-circle{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--ink);flex:none}
.ic-circle svg{width:18px;height:18px}
.ic-circle.red{background:var(--accent-soft);color:var(--accent)}
.ic-circle.navy{background:color-mix(in srgb,var(--navy) 12%,transparent);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ic-circle.navy{color:#9FB3E8}}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r-btn);border:0;background:var(--fill);color:var(--ink);font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;transition:transform .12s,background .15s;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn:active,.btn-primary:active,.btn-secondary:active{transform:scale(.97)}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--act-fill);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:transform .12s}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;transition:transform .12s}
.btn-primary svg,.btn-secondary svg{width:20px;height:20px}
.link{color:var(--act);font-weight:500}

/* navegación inferior estilo iOS */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);text-decoration:none;position:relative;transition:color .15s}
nav.tabs a svg{width:25px;height:25px;stroke-width:1.7;transition:transform .2s}
nav.tabs a[aria-current="page"]{color:var(--act)}
nav.tabs a:active svg{transform:scale(.9)}
.gx-badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface)}

/* HOY: portada antes del viaje */
.hero{position:relative;border-radius:20px;overflow:hidden;background:#0d1530;color:#fff;margin:6px 0 12px;box-shadow:var(--shadow);aspect-ratio:4/5;max-height:560px;min-height:420px;width:100%}
.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:60% 40%;animation:kb 28s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 46%,rgba(0,0,0,.55) 100%)}
.hero .htop{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.hero .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.42)}
.hero .hbody{position:absolute;left:20px;right:84px;top:58px}
.hero .lbl{font-size:15px;font-weight:500;opacity:.88}
.hero .days{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hero .days .num{font-size:84px;line-height:.95;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .days .unit{font-size:24px;font-weight:600;letter-spacing:-.01em}
.hero .hms{display:flex;gap:16px;margin-top:8px;font-variant-numeric:tabular-nums}
.hero .hms div{display:flex;align-items:baseline;gap:3px}
.hero .hms .num{font-size:22px;font-weight:600;letter-spacing:-.01em}
.hero .hms .unit{font-size:13px;opacity:.8}
.hero .phrase{margin-top:10px;font-size:15px;opacity:.9;min-height:21px}
.hero .kanji{position:absolute;right:18px;top:64px;writing-mode:vertical-rl;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:300;font-size:40px;letter-spacing:.32em;line-height:1;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.45);opacity:.94;pointer-events:none}
.hero .kanji::after{content:"";display:block;width:1px;height:44px;margin:10px auto 0;background:rgba(255,255,255,.7)}
.hero .credit{position:absolute;right:14px;bottom:10px;font-size:11px;opacity:.6}
.num.tick{animation:tick .35s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{opacity:.25;transform:translateY(-4px)}to{opacity:1;transform:none}}
.phrase{animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero .plane{position:absolute;left:0;top:0;width:22px;height:22px;color:#fff;opacity:.95;offset-path:path("M -30 150 C 90 60, 230 40, 470 90");offset-rotate:auto;animation:fly 16s linear infinite;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
@keyframes fly{0%{offset-distance:0%;opacity:0}8%{opacity:.95}88%{opacity:.95}100%{offset-distance:100%;opacity:0}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);margin:12px 0}
.facts div{padding:14px 12px;min-width:0}
.facts div + div{border-left:.5px solid var(--line)}
.facts small{display:block;font-size:12px;color:var(--muted)}
.facts strong{display:block;font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoy2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.hoy2 .card.hc{margin:0;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);min-width:0;padding:14px}
.hoy2 .hc b{font-size:15px;font-weight:600;line-height:1.3}
.hoy2 .hc-when{font-size:13px;color:var(--accent);font-weight:600}
.hoy2 .hc-sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.hoy2 .hc-go{margin-top:auto;padding-top:8px;font-size:13px;font-weight:600;color:var(--act);display:flex;align-items:center;gap:2px}
.hoy2 .hc-go svg{width:14px;height:14px}
.hoy2 .hc-ring{display:flex;align-items:center;gap:10px;margin-top:2px}
.hoy2 .hc-ring .ring{width:46px;height:46px;flex:none}
.hoy2 .hc-ring b{display:block;font-size:18px;font-weight:700}
.hdec summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer}
.hdec summary::-webkit-details-marker{display:none}
.hdec summary .eyebrow{flex:1}
.hdec .hdec-n{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.hdec .chev{transition:transform .2s;color:var(--muted)}
.hdec[open] .chev{transform:rotate(90deg)}
.hdec:not([open]) .dec{display:none}
.hdec .dec:first-of-type{margin-top:6px}
.maplink .chev{color:var(--muted);flex:none}
.thero{position:relative;margin:14px 0 12px;border-radius:var(--r-card);overflow:hidden;background:var(--navy);color:#fff;min-height:230px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.thero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7))}
.thero .txt{position:relative;padding:18px 18px 16px;min-width:0}
.thero .eyebrow{color:rgba(255,255,255,.85)}
.thero .place{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05;text-transform:uppercase;margin-top:4px;text-wrap:balance}
.thero .place span{font-weight:500;opacity:.85}
.thero .when{font-size:15px;margin-top:6px;opacity:.95}
.thero .via{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px;opacity:.85}
.thero .via svg{width:15px;height:15px}
.thero .credit{position:absolute;top:10px;right:10px;font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.9);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.tnext .eyebrow,.card.thotel .eyebrow{margin-bottom:8px}
.tnext .until{display:inline-block;margin:4px 0 2px;padding:2px 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.thotel .th-row{display:flex;gap:12px;align-items:flex-start}
.thotel .th-row .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.thotel .th-row b{font-size:16px;font-weight:600}
.thotel .acts{margin-top:12px}
.tgo{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0;padding:14px;border-radius:14px;background:var(--act-fill);color:#fff;font-weight:600;font-size:16px;text-decoration:none}
.tgo svg{width:18px;height:18px}
.tgo:active{opacity:.85}
.card.tmorrow{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.card.tmorrow b{flex:1;font-weight:600;min-width:0}
.card.tmorrow svg{width:16px;height:16px;color:var(--muted);flex:none}
.milestone{font-size:14px;color:var(--muted);margin:0 2px}
.milestone b{color:var(--ink);font-weight:600}
.next{display:flex;align-items:center;gap:12px}
.next .grow{min-width:0;flex:1}
.next b{display:block;font-size:16px;font-weight:600}
.next span{display:block;font-size:14px;color:var(--muted)}
.ring{width:44px;height:44px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--fill2)}
.ring .fgc{stroke:var(--pos);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.dec{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.dec + .dec{border-top:.5px solid var(--line)}
.dec svg{width:20px;height:20px;color:var(--act);flex:none;margin-top:1px}
.dec p{margin:0;font-size:15px;line-height:1.4}
.routechips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-snap-type:x proximity}
.routechips::-webkit-scrollbar{display:none}

/* HOY durante el viaje */
.now{display:flex;gap:14px;align-items:flex-start}
.now .tm{font-size:22px;font-weight:700;letter-spacing:-.02em;min-width:64px;font-variant-numeric:tabular-nums}
.now .grow{min-width:0;flex:1}
.now .nm{font-size:17px;font-weight:600}
.kv{display:flex;align-items:center;gap:12px}
.kv .grow{flex:1;min-width:0}
.kv b{display:block;font-size:16px;font-weight:600}
.kv span{display:block;font-size:14px;color:var(--muted)}

/* DÍAS: ruta, filtros y cabeceras */
.route{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 12px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.route::-webkit-scrollbar{display:none}
.route button{flex:none;scroll-snap-align:start;background:var(--surface);border:0;border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:108px}
.route button .lc{font-size:13px;color:var(--act);font-weight:500}
.route button b{font-size:15px;font-weight:600}
.route button span:last-child{font-size:12px;color:var(--muted)}
.filter{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:0 16px 4px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:0 14px;min-height:34px;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.filter button[aria-pressed="true"]{background:var(--act-fill);color:#fff}

section.banner{position:relative;margin:24px 0 12px;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.bphoto{position:relative;aspect-ratio:16/10;max-height:300px;width:100%;overflow:hidden;background:var(--fill)}
.bphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 30s ease-in-out infinite alternate}
.bphoto svg{position:absolute;inset:0;width:100%;height:100%}
.bphoto .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.5) 100%)}
.bphoto .bk{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.bphoto .bk small{display:block;font-size:13px;font-weight:500;opacity:.9}
.bphoto .bk b{display:block;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
.bphoto .bl{position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:500}
.binfo{padding:12px 16px 14px}
.bcities{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none;font-size:15px}
.bcities i{font-style:normal;color:var(--act);margin-right:5px;font-size:14px}
.bmeta{margin-top:4px;font-size:14px;color:var(--muted)}

/* día */
details.day{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
details.day > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:12px 14px 12px 12px}
details.day > summary::-webkit-details-marker{display:none}
.date{text-align:center;line-height:1}
.date .dw{font-size:12px;font-weight:600;color:var(--act);text-transform:uppercase;letter-spacing:.02em}
.date .dn{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.date .dm{font-size:12px;color:var(--muted);margin-top:2px}
.meta{min-width:0}
.meta .t{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.meta .s{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dright{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;transition:transform .25s cubic-bezier(.2,.8,.2,1);color:var(--fill2)}
details.day[open] .chev{transform:rotate(90deg)}
details.day.today{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.dtag{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
details.day .body{padding:0 14px 16px;border-top:.5px solid var(--line);animation:open .28s cubic-bezier(.2,.8,.2,1)}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.stay{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px;border-radius:12px;background:var(--fill)}
.stay .grow{flex:1;min-width:0}
.stay small{display:block;font-size:12px;color:var(--muted)}
.stay b{display:block;font-size:15px;font-weight:600}
.stay .btn{background:var(--surface)}
.warn,.tip{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;font-size:14px;line-height:1.45;margin:10px 0}
.warn{background:var(--warn-soft);color:var(--ink)}
.warn svg{color:var(--warn)}
.tip{background:var(--accent-soft);color:var(--ink)}
.tip svg{color:var(--act)}
.warn svg,.tip svg{width:18px;height:18px;flex:none;margin-top:1px}
.warn strong{font-weight:600}

/* línea de tiempo */
ul.stops{list-style:none;margin:10px 0 0;padding:0;position:relative}
ul.stops::before{content:"";position:absolute;left:61px;top:14px;bottom:14px;width:2px;border-radius:1px;background:var(--line)}
li.stop,li.leg{display:grid;grid-template-columns:48px 28px 1fr;column-gap:0;position:relative}
li.stop{padding:10px 0}
li.stop .tcol{font-size:13px;font-weight:600;color:var(--ink);padding-top:4px;font-variant-numeric:tabular-nums;line-height:1.2;word-break:break-word}
li.stop .dcol{display:flex;justify-content:center;padding-top:2px}
li.stop .ccol{min-width:0;padding-left:8px}
li.leg{padding:0}
li.leg .ccol{grid-column:3;padding:0 0 0 8px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.35}
li.leg svg{width:15px;height:15px;flex:none;margin-top:1px}
.cb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--fill2);background:var(--surface);cursor:pointer;flex:none;position:relative;transition:background .15s,border-color .15s;display:grid;place-items:center}
.cb::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.cb:checked{background:var(--act-fill);border-color:var(--act-fill)}
.cb:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.nm{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;cursor:pointer}
.nm .tm{display:none}
.tags{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:1px;margin-left:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--fill);color:var(--muted);margin-left:4px;vertical-align:2px}
.tag.food{background:var(--warn-soft);color:var(--warn)}
.tag.res{background:var(--accent-soft);color:var(--accent)}
.tag.sug{background:var(--fill);color:var(--muted)}
.loc{font-size:14px;color:var(--act);margin-top:2px;opacity:.9}
.nt{font-size:14px;color:var(--muted);line-height:1.45;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stop.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--fill2)}
.stop.done .loc,.stop.done .nt{opacity:.6}

/* RESERVAS estilo Wallet */
.pass{position:relative;border-radius:16px;overflow:hidden;margin:12px 0;box-shadow:var(--shadow)}
.pass.flight{background:var(--navy);color:#fff}
.pass .ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;font-size:13px;font-weight:600}
.pass .ph span:last-child{opacity:.75;font-weight:500}
.pass .route2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px 4px}
.pass .iata{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1}
.pass .iata + small,.pass .r small{display:block;font-size:12px;opacity:.75;margin-top:4px}
.pass .r{text-align:right}
.pass .mid{display:grid;place-items:center;opacity:.8}
.pass .mid svg{width:22px;height:22px}
.pass .pf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 16px;margin-top:8px;border-top:1px dashed rgba(255,255,255,.25)}
.pass .pf small{display:block;font-size:11px;opacity:.7;font-weight:500}
.pass .pf b{display:block;font-size:15px;font-weight:600;margin-top:1px}
.pass.hotel{background:var(--surface);color:var(--ink)}
.pass.hotel .band{height:6px}
.pass.hotel .ph{color:var(--muted)}
.pass.hotel .hname{padding:6px 16px 0;font-size:19px;font-weight:600;letter-spacing:-.015em}
.pass.hotel .hcity{padding:2px 16px 0;font-size:14px;color:var(--muted)}
.pass.hotel .hcity i{font-style:normal;color:var(--act);margin-right:6px}
.pass.hotel .pf{border-top:.5px solid var(--line);margin-top:12px}
.pass.hotel .pf small{color:var(--muted);opacity:1}
.pass.hotel .pa{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 14px}
.pass.hotel .pa .small{flex:1;min-width:0}
.list{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px}
.li + .li{box-shadow:inset 64px .5px 0 -63.5px var(--line)}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-size:15px;font-weight:600}
.li span.s{display:block;font-size:13px;color:var(--muted)}
.status{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.status.ok{background:var(--pos-soft);color:var(--pos)}
.status.no{background:var(--fill);color:var(--muted)}
.status.warnc{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:6px 4px 0;line-height:1.45}

/* PREPARAR */
.prog-hero{display:flex;align-items:center;gap:16px}
.prog-hero .ring{width:64px;height:64px}
.prog-hero b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.prog-hero span{font-size:14px;color:var(--muted)}
.group-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.group-h .grow{flex:1;min-width:0}
.group-h h3{font-size:17px}
.group-h small{display:block;font-size:13px;color:var(--muted)}
.group-h .cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--pos);border-radius:2px;width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;font-size:15px;line-height:1.4}
.row + .row{border-top:.5px solid var(--line)}
.row .cb{margin-top:-1px}
.row .grow{flex:1;min-width:0;cursor:pointer}
.row.done .grow{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--fill2)}
.row.prow.done .grow{text-decoration:none}
.row.prow.done .pname{text-decoration:line-through;text-decoration-color:var(--fill2)}
.row a{color:var(--act)}

/* tablas heredadas (por si quedan) */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:.5px solid var(--line);vertical-align:top}

/* GASTOS */
.gx-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.gx-actions .btn-primary,.gx-actions .btn-secondary{min-height:52px;font-size:16px}
.gx-total small{display:block;font-size:13px;color:var(--muted)}
.gx-total .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.gx-total .per{font-size:15px;color:var(--muted);margin-top:2px}
.gx-total .per b{color:var(--ink);font-weight:600}
.gx-cats{margin-top:14px;display:grid;gap:10px}
.gx-cat{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;font-size:14px}
.gx-cat .ic-circle{width:28px;height:28px}
.gx-cat .ic-circle svg{width:15px;height:15px}
.gx-cat .lab{display:flex;flex-direction:column;gap:4px;min-width:0}
.gx-cat i{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.gx-cat em{display:block;height:100%;background:var(--act-fill);border-radius:3px;opacity:.85}
.gx-cat b{font-weight:600;font-variant-numeric:tabular-nums}
.av{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-size:15px;font-weight:600;flex:none}
.av0{background:#D92D20}.av1{background:#2F5AA8}.av2{background:#B7791F}.av3{background:#7A3F8F}
.amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.amt small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--accent)}
.gx-debt{display:flex;align-items:center;gap:12px;padding:12px 16px}
.gx-debt + .gx-debt{border-top:.5px solid var(--line)}
.gx-debt .grow{flex:1;min-width:0;font-size:15px;line-height:1.35}
.gx-debt .grow b{font-weight:600}
.gx-debt .grow span{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.gx-pay{background:var(--act-fill)!important;color:#fff!important}
.gx-hist-h{font-size:13px;font-weight:600;color:var(--muted);margin:20px 4px 6px}
.gx-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:10px 16px;cursor:pointer;color:var(--ink);min-height:60px}
.gx-item + .gx-item{box-shadow:inset 64px .5px 0 -63.5px var(--line)}
.gx-item:active{background:var(--fill)}
.gx-item img,.gx-item .ic-circle{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.gx-item img{border-radius:9px}
.gx-t{flex:1;min-width:0}
.gx-t b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gx-t small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gx-a{text-align:right;flex:none}
.gx-a b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.gx-a small{display:block;font-size:12px;color:var(--muted)}
.gx-item.pago .gx-t b{font-weight:500}
.gx-item.nuevo .gx-t b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:1px}
.gx-new{display:flex;align-items:center;gap:8px;margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.gx-who .gx-chips{margin-top:10px}
/* mapa */
.mapcard{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:var(--fill);margin:10px 0 12px}
.mapsvg{display:block;width:100%;height:auto}
.mapi{position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
.mapi .mapsvg{aspect-ratio:1000/860;cursor:grab}
.mapi .mapsvg:active{cursor:grabbing}
.mapsvg .pin{cursor:pointer;outline:none}
.mapsvg .pin.sel .dot{stroke:var(--ink)}
.mapsvg .mover{fill:var(--accent);filter:drop-shadow(0 0 3px var(--accent))}
.mapsvg .msub{opacity:0;transition:opacity .3s}
.mapsvg.near .msub{opacity:1}
.mthumb .mover,.mthumb .pulse{display:none}
.mzoom{position:absolute;right:10px;bottom:10px;transition:opacity .25s;display:flex;flex-direction:row;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15);background:var(--surface);}
.mzoom button{width:40px;height:40px;border:0;background:none;color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer}
.mzoom button+button{border-left:1px solid var(--line)}
.mzoom button svg{width:18px;height:18px}
.mapi:has(.msheet:not([hidden])) .mzoom{opacity:0;pointer-events:none}
.mhint{position:absolute;left:10px;top:10px;font-size:12px;padding:5px 9px;border-radius:999px;color:var(--muted);background:var(--surface);pointer-events:none;animation:mhint 4s 2.5s forwards}
@keyframes mhint{to{opacity:0}}
.msheet{position:absolute;left:8px;right:8px;bottom:8px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.18);touch-action:auto}
.msheet.in{animation:mshin .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes mshin{from{transform:translateY(24px);opacity:0}}
.msh-top{display:flex;gap:10px;align-items:flex-start}
.msh-top .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--muted)}
.msh-top .grow b{color:var(--ink);font-size:16px}
.msh-x{border:0;background:var(--fill);color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;flex:none}
.msh-btns{display:flex;gap:6px;margin-top:10px}
.msh-btns .btn{flex:1;justify-content:center;min-height:38px;padding:0 8px}
.msh-btns [data-msh]{flex:0 0 40px;font-size:20px}
.msh-btns [disabled]{opacity:.35}
button.mnum{border:0;cursor:pointer;font:inherit}
@media (prefers-reduced-motion: no-preference){
  .mapi .leg{animation:legfade .5s calc(var(--i)*90ms) both}
  .mapi .leg:not(.fly){stroke-dasharray:1;animation:legdraw .7s calc(var(--i)*90ms) both}
  .mapi .pin{animation:pinpop .5s calc(200ms + var(--i)*70ms) cubic-bezier(.34,1.56,.64,1) both}
  .mapi .pin .pulse{animation:pinpulse 2s ease-out infinite;opacity:.5}
  .mapi .mover{animation:legfade .4s 1.4s both}
}
@media (prefers-reduced-motion: reduce){.mapsvg .mover{display:none}}
@keyframes legdraw{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0}}
@keyframes legfade{from{opacity:0}}
@keyframes pinpop{from{transform:scale(0);opacity:0}}
@keyframes pinpulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.4);opacity:0}}
.mapsvg .sea{fill:var(--sea)}
.mapsvg .land{fill:var(--surface);stroke:var(--landl)}
.mapsvg .border{fill:none;stroke:var(--fill2)}
.mapsvg .leg{fill:none;stroke:var(--ink);opacity:.55;stroke-linecap:round}
.mapsvg .leg.fly{opacity:.4}
.mapsvg .side{fill:var(--surface)}
.mapsvg .pin circle{stroke:var(--surface)}
.mapsvg .pin.now circle{stroke:var(--ink)}
.mapsvg .pin .pulse{stroke:none}
.mapsvg .pnum{fill:#fff;font-weight:700;font-family:var(--body,system-ui)}
.mapsvg .mlbl{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;font-family:var(--body,system-ui)}
.mapsvg .mlbl.msub{font-weight:500;fill:var(--muted)}
.maplink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:10px 14px 10px 10px}
.maplink .mthumb{width:92px;flex:none;border-radius:12px;overflow:hidden;background:var(--fill)}
.maplink .mthumb .mlbl{display:none}
.maplink .grow{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.maplink .grow span{font-size:14px;color:var(--muted);line-height:1.35}
.maplink>svg{width:18px;height:18px;color:var(--muted);flex:none}
.mapapps{display:flex;gap:10px;align-items:flex-start}
.mapapps>svg{width:20px;height:20px;color:var(--act);flex:none;margin-top:2px}
.mapapps div{display:flex;flex-direction:column;gap:2px}
.mapapps span{font-size:14px;color:var(--muted)}
.mrow{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line);align-items:flex-start;transition:background .6s}
.mrow:first-child{border-top:0}
.mrow.now,.mrow.flash{background:var(--accent-soft)}
.mrow .grow{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow .grow>span{font-size:14px;color:var(--muted)}
.mrow .lc{font-weight:400;color:var(--muted);font-size:14px;margin-left:4px}
.mnum{width:26px;height:26px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mbtns .btn svg{width:16px;height:16px}

/* fotos */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
.fcard{position:relative;display:block;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--cc,#222);color:#fff;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s}
.fcard:active{transform:scale(.97)}
.fcard.wide{grid-column:1/-1;aspect-ratio:16/8}
.fcard img,.fhead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
.fcard .ftxt{position:absolute;left:12px;right:12px;bottom:11px;display:flex;flex-direction:column;gap:1px}
.fcard .ftxt b{font-size:20px;letter-spacing:-.02em;line-height:1.1}
.fcard .ftxt span:last-child{font-size:12px;opacity:.85;line-height:1.3}
.flocal{font-family:"Noto Serif JP",serif;font-size:13px;opacity:.85;letter-spacing:.06em}
.flive{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.fhoy{border-left:4px solid var(--accent)}
.fhoy h3{font-size:20px;margin:2px 0 4px}
.fhoy .eyebrow{color:var(--accent)}
.btn.fbig{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:10px;background:var(--act-fill);color:#fff;font-weight:600;border-radius:14px}
.btn.fbig svg{width:20px;height:20px}
.btn.fall{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:14px;margin:4px 0 8px;font-weight:600}
.fback{display:inline-flex;align-items:center;gap:2px;margin:14px 0 8px;color:var(--act);text-decoration:none;font-size:16px}
.fback svg{width:18px;height:18px;transform:rotate(180deg)}
.fhead{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--cc,#222);color:#fff;box-shadow:var(--shadow)}
.fhead .ftxt{position:absolute;left:16px;right:16px;bottom:14px}
.fhead h2{color:#fff;margin:0;font-size:30px}
.fhead .ftxt>span:last-child{font-size:14px;opacity:.9}
.fhead .credit{position:absolute;top:10px;right:12px;font-size:11px;opacity:.9;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px}
.flist{padding:4px 0}
.frow{display:flex;align-items:center;gap:12px;padding:13px 16px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .grow{flex:1;display:flex;flex-direction:column}
.frow .grow span{font-size:14px;color:var(--muted)}

function tripClock(){

function priceDiff(h){ const a = clpNum(h.priceBooked), b = clpNum(h.price); if (!a || !b) return ""; const d = b - a, pc = d / a * 100; return (d >= 0 ? "+" : "−") + "$" + Math.abs(d).toLocaleString("es-CL") + " (" + (d >= 0 ? "+" : "−") + Math.abs(pc).toFixed(1).replace(".",",") + "%)"; }

  if (cc === "ca") cityList = (g[0].date < "2027-02-01" ? ["Toronto","Vancouver"] : ["Vancouver","Montreal"]).map(n => ({name:n, local:""}));
  else cityList = TRIP.cities.filter(c => c.cc === cc && c.from <= g[g.length-1].date && c.to > g[0].date);
  const nights = cc === "ca" ? null : TRIP.hotels.filter(h => cityList.some(c => c.name === h.city)).reduce((n, h) => n + Math.round((pd(h.out)-pd(h.in))/86400000), 0);

function nextBooking(){
  const MM = {ene:0,feb:1,mar:2};
  const out = [];
  TRIP.flights.forEach(f => { const m = /(\d{1,2}) (ene|feb|mar)/i.exec(f.d||""); if (!m) return;
    const ds = "2027-"+String(MM[m[2].toLowerCase()]+1).padStart(2,"0")+"-"+m[1].padStart(2,"0");
    const [o, de] = f.r.split("→").map(x => x.trim()); const hs = (f.h||"").split("→")[0].trim();
    out.push({date:ds, time:hs, title:"Vuelo "+o+" → "+de, sub:f.a, icon:IC.plane, sec:"res-vuelos"}); });
  TRIP.hotels.forEach(h => out.push({date:h.in, time:(/(\d{1,2}:\d{2})/.exec(h.checkin||"")||[])[1] ? "check-in desde las "+/(\d{1,2}:\d{2})/.exec(h.checkin)[1] : "", title:"Llegada a "+h.name, sub:h.city, icon:IC.bed, sec:"res-hoteles"}));
  TRAINS().forEach(t => out.push({date:t.date, time:/^\d{1,2}:\d{2}$/.test(t.it.t||"") ? t.it.t : "", title:t.it.name, sub:(dayOf(t.date)||{}).city||"", icon:IC.train, sec:"res-trenes"}));
  const t = todayStr(), hh = nowHHMM();
  return out.filter(e => e.date > t || (e.date === t && (!/^\d/.test(e.time) || e.time.padStart(5,"0") >= hh)))
    .sort((a,b) => a.date.localeCompare(b.date) || (a.time||"99").localeCompare(b.time||"99"))[0] || null;
}

async function initDb(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    db = await window.claude.use("db");
    if (!db) return;
    gastosDb();
    let got = false;
    const timer = setTimeout(() => { if (!got) setSync("off"); }, 10000);
    db.collection("checks").onSnapshot(snap => {
      got = true; clearTimeout(timer);
      const next = {};
      const srvAt = {};
      const nextBy = {};
      snap.docs.forEach(d => { const v = d.data(); srvAt[d.id] = (v && v.at) || 0; if (v && v.done) { next[d.id] = true; if (v.by) nextBy[d.id] = v.by; } });
      /* lo marcado sin señal gana, salvo que otro lo haya cambiado después */
      Object.keys(cPend).forEach(id => {
        if ((srvAt[id] || 0) > cPend[id].at) { delete cPend[id]; return; }
        if (cPend[id].done) { next[id] = true; if (cPend[id].by) nextBy[id] = cPend[id].by; } else delete next[id];
      });
      saveCPend();
      checksBy = nextBy;
      checks = next; saveLocal(); setSync(snap.metadata && snap.metadata.fromCache ? "off" : "on"); refreshChecks();
      Object.keys(cPend).forEach(pushCheck);
    }, () => { clearTimeout(timer); setSync("off"); });
  } catch(e) { db = null; }
}

async function toggle(id, val){
  /* casilla antigua de grupo en una tarea que ahora es por persona: se reparte entre los cuatro */
  const base = id.split("@")[0];
  if (id !== base && checks[base]) { ALL.forEach(k => { if (base+"@"+k !== id) toggle(base+"@"+k, true); }); toggle(base, false); }
  if (val) { checks[id] = true; if (typeof gMe !== "undefined" && gMe) checksBy[id] = gMe; } else { delete checks[id]; delete checksBy[id]; }
  cPend[id] = {done: !!val, at: Date.now(), by: (typeof gMe !== "undefined" && gMe) || null};
  saveCPend(); saveLocal(); refreshChecks(); updSync();
  pushCheck(id);
}

  }

}

function shares(e){
  const out = [0,0,0,0], total = toCLP(e), rate = total / (Number(e.amount) || 1);
  const who = (e.who && e.who.length ? e.who : ALL).filter(i => i >= 0 && i < 4);
  if (e.kind === "pago") { out[e.to] += total; return out; }
  if (e.mode === "montos" && e.amounts) {
    let sum = 0; who.forEach(i => { const v = Number(e.amounts[i]) || 0; out[i] += v * rate; sum += v; });
    const rest = (Number(e.amount) || 0) - sum;
    if (Math.abs(rest) > 1e-6) who.forEach(i => out[i] += rest * rate / who.length);
    return out;
  }
  if (e.mode === "items" && e.lines && e.lines.length) {
    const base = [0,0,0,0]; let sum = 0;
    e.lines.forEach(l => { const p = Number(l.price) || 0; const w = (l.who && l.who.length ? l.who : who); w.forEach(i => base[i] += p / w.length); sum += p; });
    if (sum > 0) { const f = total / sum; base.forEach((v,i) => out[i] = v * f); return out; }
  }
  who.forEach(i => out[i] += total / who.length);

}
function balances(list){
  const paid = [0,0,0,0], owe = [0,0,0,0], spent = [0,0,0,0];
  list.forEach(e => {

    const s = shares(e); s.forEach((v,i) => { owe[i] += v; if (e.kind !== "pago") spent[i] += v; });
  });
  return {net: paid.map((p,i) => p - owe[i]), spent};
}
function settle(net){
  const cr = [], db_ = [];
  net.forEach((v,i) => { if (v > 50) cr.push([i, v]); else if (v < -50) db_.push([i, -v]); });
  cr.sort((a,b) => b[1]-a[1]); db_.sort((a,b) => b[1]-a[1]);
  const t = []; let a = 0, b = 0;
  while (a < db_.length && b < cr.length) {
    const x = Math.min(db_[a][1], cr[b][1]);
    if (x > 50) t.push({from:db_[a][0], to:cr[b][0], amt:Math.round(x)});
    db_[a][1] -= x; cr[b][1] -= x;
    if (db_[a][1] <= 50) a++; if (cr[b][1] <= 50) b++;
  }
  return t;
}

/* ---------- avisos diarios: calendario .ics ---------- */
function makeICS(TRIP, appUrl){
  const OFF = {"Santiago":-3,"Toronto":-5,"Vancouver":-8,"Montreal":-5,"Seúl":9,"Tokio":9,"Hakone":9,"Kioto":9,"Nara":9,"Osaka":9,"Hong Kong":8};
  const CCOFF = {kr:9, jp:9, hk:8, cn:8};
  const cities = d => d.city.split(/\s*(?:→|·)\s*/).map(x => x.trim()).filter(Boolean);
  const offOf = (name, cc) => (name in OFF) ? OFF[name] : (CCOFF[cc] ?? 0);
  const pad = n => String(n).padStart(2, "0");
  const utc = (date, hhmm, off) => {
    const [y,m,d] = date.split("-").map(Number), [h,mi] = hhmm.split(":").map(Number);
    const t = new Date(Date.UTC(y, m-1, d, h - off, mi));
    return t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())+"T"+pad(t.getUTCHours())+pad(t.getUTCMinutes())+"00Z";
  };
  const addMin = (hhmm, n) => { let [h,m] = hhmm.split(":").map(Number); m += n; h += Math.floor(m/60); m = ((m%60)+60)%60; h = Math.min(h, 23); return pad(h)+":"+pad(m); };
  const escT = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const fold = line => { const out = []; let cur = ""; for (const ch of line) { if (new TextEncoder().encode(cur + ch).length > 73) { out.push(cur); cur = " " + ch; } else cur += ch; } out.push(cur); return out.join("\r\n"); };
  const isT = t => /^\d{1,2}:\d{2}$/.test(t || "");
  const stamp = utc("2026-11-21", "12:00", 0);
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ruta Asia 2027//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Ruta Asia 2027","X-WR-TIMEZONE:UTC"];
  const ev = (uid, start, end, summary, desc, alarmMin) => {
    L.push("BEGIN:VEVENT","UID:"+uid+"@ruta-asia-2027","DTSTAMP:"+stamp,"DTSTART:"+start,"DTEND:"+end,"SUMMARY:"+escT(summary),"DESCRIPTION:"+escT(desc));
    if (appUrl) L.push("URL:"+appUrl);
    if (alarmMin != null) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escT(summary),"TRIGGER:-PT"+alarmMin+"M","END:VALARM");
    L.push("END:VEVENT");
  };
  TRIP.days.forEach((d, i) => {
    const cs = cities(d), o0 = offOf(cs[0], d.cc), o1 = offOf(cs[cs.length-1], d.cc);
    const items = d.items || [];
    const lines = items.map(it => (it.t ? it.t + " · " : "") + it.name + (it.local && it.local !== it.name ? " (" + it.local + ")" : "") + (it.note ? "\n   " + it.note : ""));
    const desc = [d.city + " — " + d.title, d.stay ? "Alojamiento: " + d.stay : "", "", ...lines,
      ...(d.warns||[]).map(w => "\n⚠ Ojo: " + w), ...(d.tips||[]).map(t => "\n★ " + t),
      appUrl ? "\nDetalle, mapas y tarjetas de taxi en la app: " + appUrl : ""].filter((x, k) => x !== "" || k === 2).join("\n");
    /* aviso de la mañana: 07:30, o 45 min antes de la primera actividad si es más temprano (no antes de las 04:00) */
    const first = items.find(it => isT(it.t));
    let wake = "07:30";
    if (first && first.t < "08:15") wake = addMin(first.t, -45);
    if (wake < "04:00") wake = "04:00";
    if (i === 0) wake = "09:00";
    const n = i + 1;
    const firstTxt = first ? " · parte " + first.t + " " + first.name : "";
    ev("dia-" + d.date, utc(d.date, wake, o0), utc(d.date, addMin(wake, 15), o0), "Día " + n + " · " + d.title + firstTxt, desc, 0);
    /* aviso de la noche anterior: qué preparar para mañana */
    if (i > 0) {
      const prev = TRIP.days[i-1], pc = cities(prev), po = offOf(pc[pc.length-1], prev.cc);
      ev("noche-" + d.date, utc(prev.date, "21:00", po), utc(prev.date, "21:10", po), "Mañana: " + d.title + (first ? " · primera actividad " + first.t : ""), desc, 0);
    }
    /* actividades en el calendario (sin alarma), solo si el día no cambia de huso horario */
    if (o0 === o1) {
      let last = "00:00";
      items.forEach((it, k) => {
        if (!isT(it.t) || it.t < last) return;
        last = it.t;
        const nx = items.slice(k+1).find(x => isT(x.t) && x.t > it.t);
        const end = nx ? nx.t : addMin(it.t, 90);
        ev("act-" + it.id, utc(d.date, it.t, o0), utc(d.date, end, o0), it.name + (it.local && it.local !== it.name ? " · " + it.local : ""), [it.note, it.leg ? "Cómo llegar: " + it.leg : "", it.addr ? "Dirección: " + it.addr : ""].filter(Boolean).join("\n"), null);
      });
    }
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n") + "\r\n";
}

  const snap = () => { const pts = [...P.values()]; const r = svg.getBoundingClientRect();

    if (!MV.moved) return;
